name: Build Windows (.exe portable)

on:
  workflow_dispatch:
  push:
    branches: [main, claude/new-session-smaoex]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt pyinstaller
      - name: Pruebas
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Compilar con PyInstaller
        run: pyinstaller --noconfirm --clean --windowed --name QuoteTrack --icon assets\icon.ico --add-data "assets;assets" --collect-data docx main.py
      - name: Comprobar que el ejecutable abre
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\QuoteTrack\QuoteTrack.exe" -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { throw "QuoteTrack.exe se cerró al iniciar (código $($p.ExitCode))" }
          Stop-Process -Id $p.Id -Force
      - name: Compilar el servidor MCP (QuoteTrackMCP.exe, sin ventana)
        id: mcp
        continue-on-error: true        # si falla, la aplicación se entrega igual
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --noconsole --name QuoteTrackMCP --add-data "assets;assets" --collect-data docx --exclude-module PySide6 quotetrack_mcp.py
          # un .exe sin consola no se puede canalizar con «&»: se lanza con tuberías y se comprueba que responde
          $psi = New-Object System.Diagnostics.ProcessStartInfo
          $psi.FileName = (Resolve-Path "dist\QuoteTrackMCP.exe").Path
          $psi.Arguments = "--db `"$env:RUNNER_TEMP\no_existe.db`" --sin-latido"
          $psi.RedirectStandardInput = $true; $psi.RedirectStandardOutput = $true; $psi.RedirectStandardError = $true
          $psi.UseShellExecute = $false; $psi.CreateNoWindow = $true
          $p = [System.Diagnostics.Process]::Start($psi)
          $p.StandardInput.WriteLine('{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05"}}')
          $p.StandardInput.Flush()
          $t = $p.StandardOutput.ReadLineAsync()
          if (-not $t.Wait(60000)) { $p.Kill(); throw "QuoteTrackMCP.exe no respondió en 60 s" }
          $salida = $t.Result
          $p.StandardInput.Close(); if (-not $p.WaitForExit(10000)) { $p.Kill() }
          if ($salida -notmatch "quotetrack") { throw "QuoteTrackMCP.exe no respondió al protocolo MCP: $salida" }
          Copy-Item "dist\QuoteTrackMCP.exe" "dist\QuoteTrack\QuoteTrackMCP.exe"
      - name: Comprimir
        shell: pwsh
        run: Compress-Archive -Path dist\QuoteTrack -DestinationPath QuoteTrack_portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: QuoteTrack_portable
          path: QuoteTrack_portable.zip
